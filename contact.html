<body class="contact-page">

    <!-- HEADER -->

        <div class="header-left">
            <img class="nav-picture" src="img/Profil_Navigation.avif" alt="Profilbild Navigation">

</section>

<main class="contact-layout">

    <div class="contact-info">
        <h2>Telefon</h2>
        <p>076 00 00 00</p>

        <a href="https://www.linkedin.com/feed/">
            <img src="img/linkedin_icon.svg" alt="LinkedIn" class="icon">
        </a>
    </div>

    <form class="contact-form">
        <label for="vorname">Vorname</label>
        <input type="text" id="vorname" name="vorname">

        <label for="nachname">Nachname</label>
        <input type="text" id="nachname" name="nachname">

        <label for="email">E-Mail-Adresse</label>
        <input type="email" id="email" name="email">

        <label for="betreff">Betreff</label>
        <input type="text" id="betreff" name="betreff">

        <label for="nachricht">Nachricht</label>
        <textarea id="nachricht" name="nachricht"></textarea>

        <button type="submit">Absenden</button>
    </form>

</main>




    <!-- Kontakt -->
    <footer class="footer">
        <div class="footer-section telefon">
